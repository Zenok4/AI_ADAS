server:
  host: 0.0.0.0
  port: 8000
  grpc_port: "[::]:8500"

# ── Region of Interest (ROI) ──────────────────────────────────────────────
# Giới hạn vùng nhận diện cho từng module AI.
# Tọa độ: tỉ lệ 0.0–1.0 (ví dụ 0.5 = 50% chiều rộng/cao)
#          hoặc pixel tuyệt đối (số nguyên > 1).
# mode: "crop"  → cắt frame, tọa độ box tự động dịch về hệ gốc
#        "mask" → giữ kích thước, vùng ngoài ROI tô đen
roi:
  sign:
    enabled: true
    mode: crop
    x1: 0.0
    y1: 0.0
    x2: 1.0
    y2: 0.6       # Chỉ nhận diện nửa trên của frame

  object:
    enabled: true
    mode: crop
    x1: 0.0
    y1: 0.2       # Bỏ qua 20% trên (bầu trời)
    x2: 1.0
    y2: 1.0

  lane:
    enabled: true
    mode: crop
    x1: 0.0
    y1: 0.4       # Chỉ nhận diện nửa dưới (mặt đường)
    x2: 1.0
    y2: 1.0

# ── Lane Departure Warning (LDW) ──────────────────────────────────────────
# Cấu hình cảnh báo lệch làn đường.
lane_departure:
  enabled: true
  offset_threshold: 0.2   # Ngưỡng lệch (0.0–1.0) tính theo tỉ lệ nửa chiều rộng frame
                           # Ví dụ: 0.2 → cảnh báo khi xe lệch > 20% nửa chiều rộng
  min_confidence: 0.4      # Bỏ qua vạch có confidence thấp hơn ngưỡng này
  stable_frames_required: 5  # Số frame lệch liên tiếp trước khi phát cảnh báo (chống nhấp nháy)



models:
  sign:
    path: models/sign/best.pt
    conf: 0.45
    iou: 0.45
    imgsz: 640
    max_det: 100
    agnostic_nms: false
    half: false

  object:
    path: models/object/best.pt
    conf: 0.45
    iou: 0.5
    imgsz: 640
    max_det: 100
    agnostic_nms: false
    half: false

  lane:
    path: models/lane/best.pt
    method: opencv        # opencv | ufldv2 | yolo
    conf: 0.5
    iou: 0.45
    ufldv2_onnx: external/Ultra-Fast-Lane-Detection-v2/ufldv2_tusimple_res18_320x800.onnx
    ufldv2_dataset: Tusimple
    ufldv2_input_width: 800
    ufldv2_input_height: 320
    ufldv2_resize_height: 400
    ufldv2_num_row: 56
    ufldv2_num_col: 41
    ufldv2_num_cell_row: 100
    ufldv2_num_cell_col: 100

collision:
  # Distance thresholds for collision warning
  critical_distance_m: 2.5
  high_distance_m: 5.0
  medium_distance_m: 10.0

  # Time-to-collision thresholds
  critical_ttc_s: 1.5
  high_ttc_s: 3.0
  medium_ttc_s: 5.0

  # Detection quality filters
  min_confidence: 0.40
  min_box_width_px: 20
  min_box_height_px: 20

  # Default focal length in pixel for depth approximation
  default_focal_length_px: 1000.0
