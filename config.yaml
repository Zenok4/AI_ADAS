server:
  host: 0.0.0.0
  port: 8000
  grpc_port: "[::]:8500"

models:
  sign:
    path: models/sign/best.pt
    conf: 0.45
    iou: 0.45
    imgsz: 640
    max_det: 100
    agnostic_nms: false
    half: false

  object:
    path: models/object/best.pt
    conf: 0.45
    iou: 0.5
    imgsz: 640
    max_det: 100
    agnostic_nms: false
    half: false

  lane:
    path: models/lane/best.pt
    conf: 0.5
    iou: 0.45

collision:
  # Distance thresholds for collision warning
  critical_distance_m: 2.5
  high_distance_m: 5.0
  medium_distance_m: 10.0

  # Time-to-collision thresholds
  critical_ttc_s: 1.5
  high_ttc_s: 3.0
  medium_ttc_s: 5.0

  # Detection quality filters
  min_confidence: 0.40
  min_box_width_px: 20
  min_box_height_px: 20

  # Default focal length in pixel for depth approximation
  default_focal_length_px: 1000.0
