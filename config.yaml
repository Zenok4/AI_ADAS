server:
  host: 0.0.0.0
  port: 8500

models:
  sign:
    path: models/sign/best.pt
    conf: 0.5
    iou: 0.45
  object:
    path: models/object/best.pt
    conf: 0.5
    iou: 0.45

# ROI (Region of Interest) - tỉ lệ theo kích thước frame (0.0 -> 1.0)
# Format: [x_min, y_min, x_max, y_max]
roi:
  sign:   [0.20, 0.00, 0.80, 0.65]   # Vùng trung tâm phía trước, bỏ 2 bên đường
  object: [0.25, 0.35, 0.75, 1.00]   # Làn đường phía trước (dải giữa)
  drowsy: [0.00, 0.00, 1.00, 1.00]   # Toàn frame
